# master push → 이미지 빌드/푸시(GHCR) → NAS에 deploy/ 복사 → compose pull & up
# 절차와 NAS 준비는 deploy/README.md 1장. k-drinker·lottery-picker 의 deploy.yml 과 같은 패턴이다.
#
# 필요한 GitHub 설정 (Settings → Secrets and variables → Actions)
#   Secrets   : NAS_HOST, NAS_SSH_PORT, NAS_SSH_USER, NAS_SSH_KEY  (Repository secrets 탭)
#   Variables : NAS_DEPLOY_DIR — 선택. 비우면 /volume1/docker/theclimbingnight  (Repository variables 탭)

name: deploy

on:
  push:
    branches: [master]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
      - "!deploy/**/*.md"
      - "!apps/**/*.md"
      - "!docs/**"
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    # 수동 실행에서 다른 브랜치를 고르면 리뷰 안 된 코드가 운영에 나간다. master 만 배포한다.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name (GHCR는 소문자만 허용)
        id: img
        run: |
          OWNER="${{ github.repository_owner }}"
          echo "name=ghcr.io/${OWNER,,}/theclimbingnight-${{ matrix.app }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          push: true
          # Synology DS1520+ (x86_64)
          platforms: linux/amd64
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      DEPLOY_DIR: ${{ vars.NAS_DEPLOY_DIR || '/volume1/docker/theclimbingnight' }}
    steps:
      - name: Check required secrets (값은 출력하지 않음 — 이름만)
        env:
          NAS_HOST: ${{ secrets.NAS_HOST }}
          NAS_SSH_PORT: ${{ secrets.NAS_SSH_PORT }}
          NAS_SSH_USER: ${{ secrets.NAS_SSH_USER }}
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
        run: |
          missing=""
          for n in NAS_HOST NAS_SSH_PORT NAS_SSH_USER NAS_SSH_KEY; do
            [ -z "${!n}" ] && missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::비어 있는 Repository secret:$missing — deploy/README.md 1-3"
            exit 1
          fi

      - uses: actions/checkout@v4

      # deploy/ 디렉터리째 보내 <DEPLOY_DIR>/deploy/ 에 풀린다. deploy/.env 는 gitignore라 체크아웃에 없고,
      # rm: false 라 대상의 기존 파일(deploy/.env, backups/)은 지우지 않는다.
      - name: Copy deploy/ to NAS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.NAS_HOST }}
          port: ${{ secrets.NAS_SSH_PORT }}
          username: ${{ secrets.NAS_SSH_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          source: "deploy"
          target: ${{ env.DEPLOY_DIR }}
          rm: false
          overwrite: true

      - name: Pull & restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.NAS_HOST }}
          port: ${{ secrets.NAS_SSH_PORT }}
          username: ${{ secrets.NAS_SSH_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          # 첫 배포는 HDD 에서 mysql 초기화(최대 수 분) → api 기동 → web 순서를 기다린다
          command_timeout: 20m
          script: |
            set -e
            export PATH=/usr/local/bin:$PATH        # Synology 비대화형 SSH 는 /usr/local/bin(docker) 이 PATH 에 없다
            cd "${{ env.DEPLOY_DIR }}"
            ENV_FILE=deploy/.env
            # 파일이 없으면 아래 echo >> 가 IMAGE_TAG 한 줄짜리 파일을 만들어 버린다. 먼저 막는다.
            if [ ! -f "$ENV_FILE" ]; then echo "::error::deploy/.env 가 없습니다 — deploy/README.md 1-2"; exit 1; fi
            # 컨테이너를 건드리기 전에 필수 값을 확인한다. 따옴표·공백만 있는 값도 비어 있는 것으로 본다.
            missing=""
            for key in JWT_SECRET DB_PASSWORD MYSQL_ROOT_PASSWORD CLOUDFLARE_TUNNEL_TOKEN PUBLIC_HOST; do
              val=$(grep "^$key=" "$ENV_FILE" | tail -n 1 | cut -d= -f2- | tr -d "\"' \t\r")
              [ -z "$val" ] && missing="$missing $key"
            done
            if [ -n "$missing" ]; then echo "::error::deploy/.env 에 비어 있는 값:$missing — deploy/README.md 5장"; exit 1; fi
            # IMAGE_TAG 는 파일에 써 넣는다 — sudo 가 환경변수를 초기화해도 compose 가 읽는다
            if grep -q '^IMAGE_TAG=' "$ENV_FILE"; then sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${{ github.sha }}/" "$ENV_FILE"; else echo "IMAGE_TAG=${{ github.sha }}" >> "$ENV_FILE"; fi
            if docker ps >/dev/null 2>&1; then DOCKER=docker; else DOCKER="sudo -n /usr/local/bin/docker"; fi
            DC="$DOCKER compose -f deploy/compose.yml --env-file $ENV_FILE"
            $DC pull api web
            $DC up -d --remove-orphans
            # api 가 healthy 가 될 때까지 최대 5분 기다린다. 아니면 로그를 남기고 실패한다.
            for i in $(seq 1 60); do
              status=$($DOCKER inspect -f '{{.State.Health.Status}}' "$($DC ps -q api)" 2>/dev/null || echo none)
              [ "$status" = "healthy" ] && break
              sleep 5
            done
            if [ "$status" != "healthy" ]; then
              echo "::error::api 가 healthy 가 아닙니다 ($status)"
              $DC logs --tail 100 api
              exit 1
            fi
            # 다시 만든 api·web은 IP가 바뀐다. nginx는 이름을 10초마다 다시 풀지만, 그 사이 502가 나지 않게 바로 reload 한다.
            $DC exec -T nginx nginx -s reload
            # 외부 주소(Cloudflare Tunnel → nginx → api)까지 확인한다. 컨테이너가 healthy 여도 이 경로가 끊겨 있을 수 있다.
            PUBLIC_HOST=$(grep '^PUBLIC_HOST=' "$ENV_FILE" | tail -n 1 | cut -d= -f2- | tr -d "\"' \t\r")
            ok=""
            for i in $(seq 1 12); do
              if curl -fsS -o /dev/null "https://$PUBLIC_HOST/api/v1/health"; then ok=1; break; fi
              sleep 5
            done
            if [ -z "$ok" ]; then
              echo "::error::https://$PUBLIC_HOST/api/v1/health 가 응답하지 않습니다 — deploy/README.md 2장"
              $DC logs --tail 50 nginx cloudflared
              exit 1
            fi
            $DOCKER image prune -f
            $DC ps
