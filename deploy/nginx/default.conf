# cloudflared → nginx(80) → /api/* 는 api, 나머지는 web.
# 외부 포트는 열지 않는다. 요청은 같은 compose 네트워크의 cloudflared 에서만 온다.

# 실제 접속 IP는 Cloudflare가 CF-Connecting-IP 에 싣는다. docker 브리지 대역에서 온 값만 믿는다.
set_real_ip_from 172.16.0.0/12;
real_ip_header CF-Connecting-IP;

# 접속 기록 항목: IP, 시각, 메서드·경로(쿼리스트링 제외), 상태, 응답 크기, 브라우저 정보, 처리 시간.
# 쿼리스트링과 Authorization 헤더는 남기지 않는다. 보관은 docker 로그 회전(10MB × 3개)을 따른다.
log_format tcn '$remote_addr [$time_iso8601] "$request_method $uri $server_protocol" '
                '$status $body_bytes_sent "$http_user_agent" $request_time';

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    access_log /dev/stdout tcn;

    # API multipart 한도(1MB)보다 조금 크게. 더 크면 nginx가 413으로 끊는다.
    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://web:3000;
    }
}
