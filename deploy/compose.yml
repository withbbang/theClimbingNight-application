# 집 서버(Synology NAS) 운영 구성. 사용법은 deploy/README.md.
#   docker compose -f deploy/compose.yml --env-file deploy/.env up -d
# api·web 이미지는 GitHub Actions(.github/workflows/deploy.yml)가 GHCR에 올린 것을 받는다.
# IMAGE_TAG(커밋 SHA)는 워크플로가 deploy/.env 에 써 넣는다. 비어 있으면 latest.
# 로컬에서 소스로 빌드할 때만 compose.build.yml 을 겹친다 (README 7장).
# 호스트에 여는 포트는 없다. 외부 요청은 cloudflared(Cloudflare Tunnel) → nginx 로만 들어온다.

name: theclimbingnight

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --skip-name-resolve
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --max-connections=50
    environment:
      TZ: Asia/Seoul
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?deploy/.env에 MYSQL_ROOT_PASSWORD를 넣으세요}
      MYSQL_DATABASE: theclimbingnight
      MYSQL_USER: ${DB_USERNAME:?deploy/.env에 DB_USERNAME을 넣으세요}
      MYSQL_PASSWORD: ${DB_PASSWORD:?deploy/.env에 DB_PASSWORD를 넣으세요}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 비밀번호를 명령행 인자로 넘기지 않는다.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      # NAS HDD 에서 첫 초기화는 2분이 넘는다. 그동안 실패는 세지 않는다.
      start_period: 300s
    mem_limit: 512m
    logging: *logging
    restart: unless-stopped

  api:
    image: ghcr.io/withbbang/theclimbingnight-api:${IMAGE_TAG:-latest}
    environment:
      # 프로파일이 없으면 local(H2)로 뜬다. 반드시 prod.
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Seoul
      DB_URL: jdbc:mysql://mysql:3306/theclimbingnight
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?deploy/.env에 JWT_SECRET을 넣으세요}
      KAKAO_APP_ID: ${KAKAO_APP_ID:-}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      APPLE_AUDIENCES: ${APPLE_AUDIENCES:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-com.theclimbingnight.app}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    # Spring 기본 graceful 종료(30초)가 끝날 때까지 기다린다. 대기 중인 푸시 발송도 이때 마친다.
    stop_grace_period: 40s
    mem_limit: 768m
    logging: *logging
    restart: unless-stopped

  web:
    image: ghcr.io/withbbang/theclimbingnight-web:${IMAGE_TAG:-latest}
    environment:
      TZ: Asia/Seoul
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 256m
    logging: *logging
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    environment:
      TZ: Asia/Seoul
    volumes:
      # 파일이 아니라 폴더를 마운트한다. 배포가 파일을 새로 만들어도(inode 변경) 컨테이너에 보인다.
      - ./nginx:/etc/nginx/conf.d:ro
    depends_on:
      - api
      - web
    mem_limit: 32m
    logging: *logging
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      # Cloudflare Zero Trust → Networks → Tunnels 에서 만든 터널의 토큰 (README 2장)
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?deploy/.env에 CLOUDFLARE_TUNNEL_TOKEN을 넣으세요}
    depends_on:
      - nginx
    mem_limit: 64m
    logging: *logging
    restart: unless-stopped

volumes:
  mysql-data:
