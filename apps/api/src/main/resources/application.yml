logging:
  level:
    # 유니크 위반 때 Hibernate가 SQLException 메시지(푸시 토큰 원문 포함)를 로그에 남긴다. 재시도로 복구되는 정상 경합이므로 끈다.
    org.hibernate.orm.jdbc.error: "OFF"

spring:
  application:
    name: theclimbingnight-api
  profiles:
    default: local
  datasource:
    hikari:
      # 쓰기는 행 잠금으로 직렬화한다. 잠금 뒤의 일반 조회가 커밋된 행을 보게 MySQL 기본 REPEATABLE READ 스냅숏 대신 READ COMMITTED.
      transaction-isolation: TRANSACTION_READ_COMMITTED
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  auth:
    jwt-secret: ${JWT_SECRET}
    access-ttl: 30m
    refresh-ttl: 30d
    signup-ttl: 10m
    kakao:
      base-url: https://kapi.kakao.com
      app-id: ${KAKAO_APP_ID:}
    naver:
      base-url: https://openapi.naver.com
    google:
      client-ids: ${GOOGLE_CLIENT_IDS:}
      jwks-url: https://www.googleapis.com/oauth2/v3/certs
    apple:
      audiences: ${APPLE_AUDIENCES:}
      jwks-url: https://appleid.apple.com/auth/keys
      # 탈퇴할 때 Apple 토큰 폐기에 쓴다. 키가 비면 폐기하지 않는다 (스토어 제출 전 반드시 채운다).
      base-url: https://appleid.apple.com
      client-id: ${APPLE_CLIENT_ID:com.theclimbingnight.app}
      team-id: ${APPLE_TEAM_ID:}
      key-id: ${APPLE_KEY_ID:}
      private-key: ${APPLE_PRIVATE_KEY:}
  push:
    enabled: false
    base-url: https://exp.host
    access-token: ${EXPO_ACCESS_TOKEN:}
