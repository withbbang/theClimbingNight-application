logging:
  level:
    # 유니크 위반 때 Hibernate가 SQLException 메시지(푸시 토큰 원문 포함)를 로그에 남긴다. 재시도로 복구되는 정상 경합이므로 끈다.
    org.hibernate.orm.jdbc.error: "OFF"

spring:
  application:
    name: theclimbingnight-api
  profiles:
    default: local
  datasource:
    hikari:
      # 쓰기는 행 잠금으로 직렬화한다. 잠금 뒤의 일반 조회가 커밋된 행을 보게 MySQL 기본 REPEATABLE READ 스냅숏 대신 READ COMMITTED.
      transaction-isolation: TRANSACTION_READ_COMMITTED
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  auth:
    jwt-secret: ${JWT_SECRET}
    access-ttl: 30m
    refresh-ttl: 30d
    signup-ttl: 10m
    kakao:
      base-url: https://kapi.kakao.com
      app-id: ${KAKAO_APP_ID:}
    naver:
      base-url: https://openapi.naver.com
    google:
      client-ids: ${GOOGLE_CLIENT_IDS:}
      jwks-url: https://www.googleapis.com/oauth2/v3/certs
    apple:
      audiences: ${APPLE_AUDIENCES:}
      jwks-url: https://appleid.apple.com/auth/keys
      # 탈퇴할 때 Apple 토큰 폐기에 쓴다. 키가 비면 폐기하지 않는다 (스토어 제출 전 반드시 채운다).
      base-url: https://appleid.apple.com
      client-id: ${APPLE_CLIENT_ID:com.theclimbingnight.app}
      team-id: ${APPLE_TEAM_ID:}
      key-id: ${APPLE_KEY_ID:}
      private-key: ${APPLE_PRIVATE_KEY:}
  push:
    enabled: false
    base-url: https://exp.host
    access-token: ${EXPO_ACCESS_TOKEN:}
  # R2 키 다섯 개(accountId·accessKeyId·secretAccessKey·incomingBucket·publicBucket)가 모두 있어야 켜진다. 비면 사진 올리기는 MEDIA_UNAVAILABLE.
  media:
    account-id: ${R2_ACCOUNT_ID:}
    access-key-id: ${R2_MEDIA_ACCESS_KEY_ID:}
    secret-access-key: ${R2_MEDIA_SECRET_ACCESS_KEY:}
    incoming-bucket: ${R2_MEDIA_INCOMING_BUCKET:}
    public-bucket: ${R2_MEDIA_PUBLIC_BUCKET:}
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:}
    originals-dir: ${MEDIA_ORIGINALS_DIR:/media/originals}
  # 워커 루프는 worker 프로필에서만 켠다(application-worker.yml). 캐시 비우기 토큰이나 zone이 비면 숨긴 사진의 CDN 캐시를 비우지 않는다.
  worker:
    enabled: false
    cloudflare-zone-id: ${CLOUDFLARE_ZONE_ID:}
    cloudflare-cache-purge-token: ${CLOUDFLARE_CACHE_PURGE_TOKEN:}
